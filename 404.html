<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Srujan Yamali- not found</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fcf5e4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262626" media="(prefers-color-scheme: dark)" />
    <!-- Theme before first paint: a theme chosen in the properties is kept,
         otherwise it follows the visitor's clock, light from 7am to 7pm.
         src/theme.js applies the same rule after load; src/themes.js is the
         list these ids and papers come from. -->
    <script>
      (function () {
        var bg = {
          light: "#fcf5e4", dark: "#262626", nord: "#2e3440", dracula: "#282a36",
          solarized: "#fdf6e3", monokai: "#272822", ocean: "#1b2838", cyberpunk: "#050508"
        };
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (!bg.hasOwnProperty(t)) {
          var h = new Date().getHours();
          t = h >= 7 && h < 19 ? "light" : "dark";
        }
        var r = document.documentElement;
        r.setAttribute("data-theme", t);
        r.style.colorScheme = t === "light" || t === "solarized" ? "light" : "dark";
        var m = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < m.length; i++) m[i].setAttribute("content", bg[t]);
      })();
    </script>
    <script type="module" src="/src/theme.js"></script>
    <!-- Every URL here is absolute, because this page is served at whatever
         path was not found, however deep it is. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/site.css" />

        </dl>
